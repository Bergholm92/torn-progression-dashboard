name: Frontend smoke tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Show Node.js version
        run: node --version
      - name: Run existing dashboard smoke tests
        run: node tests/smoke.cjs
